name: Generate and Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install custom emmylua_doc_cli
        run: curl.exe -L -o emmylua_doc_cli.exe https://github.com/haminpants/emmylua-analyzer-rust/releases/download/v1.0.2/emmylua_doc_cli.exe

      - name: Generate Docs
        run: .\emmylua_doc_cli.exe ./library -o ./docs --site-name "Miliastra Wonderland Lua API"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
